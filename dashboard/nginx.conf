server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  include /etc/nginx/mime.types;
  # this dashboard gets rebuilt constantly during development; without this, browsers
  # can silently keep serving a stale cached app.js after a rebuild — clicks on newly
  # added buttons then do nothing, with no error, because the old JS has no handler.
  add_header Cache-Control "no-store" always;
  location / {
    try_files $uri $uri/ /index.html;
  }
}
